# Builds and publishes a release when a version tag such as v0.1.0 is pushed.
# Actions are pinned to commit SHAs, and Zig to its published checksum, so a
# moved tag or a swapped download can't change what gets built.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          # Apple Silicon: hive and Hive.app, with the Xcode used locally.
          # (Fallback if the preview image misbehaves: macos-26 with Xcode_26.6.)
          - os: xcode-27
            developer_dir: /Applications/Xcode_27.1.app/Contents/Developer
          # x86_64: hive, built for glibc 2.28 so it runs on older distributions.
          - os: ubuntu-24.04
            zig_target: x86_64-linux-gnu.2.28
    runs-on: ${{ matrix.os }}
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      ZIG_TARGET: ${{ matrix.zig_target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version comes from the tag (git describe)
          persist-credentials: false

      - name: Check the tag is semver and in the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "not semver: $GITHUB_REF_NAME"; exit 1; }
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27' # the newest 1.27 patch, with its security fixes
          check-latest: true
          cache-dependency-path: go.sum

      - name: Zig 0.16
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            url=https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz
            sum=b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
          else
            url=https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
            sum=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          fi
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" "$url"
          echo "$sum  $RUNNER_TEMP/zig.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "ZIG=$RUNNER_TEMP/zig/zig" >> "$GITHUB_ENV"

      - name: Build libghostty-vt
        run: make vt

      - name: Test
        run: make test

      - name: Test the app
        if: runner.os == 'macOS'
        run: make build && cd apps/macos && swift test

      - name: Package
        run: |
          test "$(make -s version)" = "${GITHUB_REF_NAME#v}" || { echo "version $(make -s version) does not match the tag"; exit 1; }
          script/release.sh

      - name: Check the Linux binary runs on glibc 2.28
        if: runner.os == 'Linux'
        run: |
          max="$(objdump -T bin/hive | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)"
          echo "highest glibc symbol: $max"
          test "$(printf '%s\nGLIBC_2.28\n' "$max" | sort -V | tail -1)" = GLIBC_2.28

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/hive-*
            dist/Hive-*
          if-no-files-found: error

  # The Android app, signed with the release key from the repository's
  # secrets (ANDROID_KEYSTORE_BASE64, HIVE_RELEASE_PW). Without them it's
  # skipped, and the release has no APK.
  android:
    runs-on: ubuntu-24.04
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.HIVE_RELEASE_PW != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: env.HAS_KEY == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - name: Zig 0.16 and the NDK
        if: env.HAS_KEY == 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "ZIG=$RUNNER_TEMP/zig/zig" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null || true
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build and sign
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          HIVE_RELEASE_PW: ${{ secrets.HIVE_RELEASE_PW }}
        run: |
          make vt-android
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          export HIVE_RELEASE_KEYSTORE="$RUNNER_TEMP/release.jks" HIVE_VERSION="${GITHUB_REF_NAME#v}"
          (cd apps/android && ./gradlew --no-daemon testDebugUnitTest assembleRelease)
          rm "$RUNNER_TEMP/release.jks"
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/release/app-release.apk "dist/hive-$HIVE_VERSION-android.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.HAS_KEY == 'true'
        with:
          name: dist-android
          path: dist/hive-*-android.apk
          if-no-files-found: error

  release:
    needs: [build, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write     # for the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and notes
        run: |
          (cd dist && sha256sum hive-* Hive-* > SHA256SUMS && cat SHA256SUMS)
          v="${GITHUB_REF_NAME#v}"
          # The changelog section for this version, without its heading.
          # Stops at the next version, or at the link references at the end.
          awk -v v="$v" '/^## \[/{ if (on) exit; on = index($0, "## [" v "]") == 1; next } /^\[[^]]+\]: /{ if (on) exit } on' CHANGELOG.md > notes.md
          test -s notes.md

      # Signed provenance: users can check a download was built here, from
      # this commit (gh attestation verify FILE --owner manueltarouca).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/hive-*
            dist/Hive-*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          pre=""
          case "$v" in *-*) pre="--prerelease" ;; esac
          # A draft first, so a failed upload leaves nothing public and the
          # job can simply be re-run.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "hive $v" --notes-file notes.md $pre
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
