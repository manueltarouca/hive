<!doctype html>
<!-- The social preview card. Open with a viewport of the card size and
     capture it (see README.md here). bg.webp is the key visual. -->
<meta charset="utf-8">
<style>
  @font-face { font-family: Inter; src: url(../src/lib/fonts/InterVariable.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url(../src/lib/fonts/JetBrainsMono-Regular.ttf); }
  html, body { margin: 0; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #1d1f21 url(bg.webp) center / cover no-repeat;
         color: #ece8e1; font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
  .card { position: relative; width: 100%; height: 100%; }
  .text { position: absolute; left: 6.5%; top: 50%; transform: translateY(-50%); width: 46%; }
  .mark { display: flex; align-items: center; gap: 0.9vw; margin-bottom: 4.2vh; }
  .mark img { width: 5.4vw; height: 5.4vw; }
  .mark b { font-weight: 600; font-size: 3.7vw; letter-spacing: -0.035em; }
  h1 { margin: 0; text-wrap: balance; font-weight: 500; font-size: 3.55vw; line-height: 1.12; letter-spacing: -0.025em; }
  h1 span { color: #f2a93b; }
  p { margin: 3.2vh 0 0; text-wrap: balance; font-weight: 400; font-size: 1.62vw; line-height: 1.45; color: rgb(236 232 225 / 0.66); }
  .url { position: absolute; left: 6.5%; bottom: 7.5%; font: 400 1.15vw/1 'JetBrains Mono', monospace; color: rgb(236 232 225 / 0.5); }
  .shot { position: absolute; left: 56%; top: 15%; width: 68%; border-radius: 1vw; box-shadow: 0 2vw 5vw rgb(0 0 0 / 0.55), 0 0 0 1px rgb(255 255 255 / 0.06); }
</style>
<div class="card">
  <div class="text">
    <div class="mark"><img src="../../.github/assets/icon.png" alt=""><b>hive</b></div>
    <h1>A terminal multiplexer for <span>agent-heavy work.</span></h1>
    <p>Sessions that survive restarts. Agents you can see. An API for everything.</p>
  </div>
  <img class="shot" src="shot.webp" alt="">
  <div class="url">github.com/manueltarouca/hive</div>
</div>
